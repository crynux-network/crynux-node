# Build the binary release version for Mac

name: Release Crynux Node using the tag name

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  push:
    tags:
      - '*'

env:
  RELEASE_VERSION: 3.6.0
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  actions: write
  packages: write
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-22.04
    steps:
       - run: echo "null"
    outputs:
      version: ${{ env.RELEASE_VERSION }}

  build-the-docker-images:
    strategy:
      matrix:
        blockchain:
          - base
          - near
          - rh
    name: Build the Docker image for ${{ matrix.blockchain }}
    uses: ./.github/workflows/release-all-docker.yml
    secrets: inherit
    with:
      blockchain: ${{ matrix.blockchain }}

  build-the-mac-dmgs:
    needs: [prepare-version]
    strategy:
      matrix:
        blockchain:
          - base
          - near
          - rh
    name: Build the Mac DMG for ${{ matrix.blockchain }}
    uses: ./.github/workflows/release-all-mac.yml
    secrets: inherit
    with:
      blockchain: ${{ matrix.blockchain }}
      release_version: ${{ needs.prepare-version.outputs.version }}

  build-the-windows-binaries:
    needs: [prepare-version]
    strategy:
      matrix:
        blockchain:
          - base
          - near
          - rh
    name: Build the Windows binary for ${{ matrix.blockchain }}
    uses: ./.github/workflows/release-all-windows.yml
    secrets: inherit
    with:
      blockchain: ${{ matrix.blockchain }}
      release_version: ${{ needs.prepare-version.outputs.version }}

  publish-release:
    runs-on: ubuntu-22.04
    needs:
      - build-the-windows-binaries
      - build-the-mac-dmgs
    permissions:
        contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Google Drive link artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gdrive-links-*

      - name: Read Google Drive links
        id: read_links
        run: |
          # Read Base links
          WINDOWS_DOWNLOAD_LINK_BASE=$(tr -d '\r\n' < gdrive-links-base/download_link.txt | sed 's/[\x00-\x1F]//g')
          WINDOWS_PREVIEW_LINK_BASE=$(tr -d '\r\n' < gdrive-links-base/view_link.txt | sed 's/[\x00-\x1F]//g')

          # Read Near links
          WINDOWS_DOWNLOAD_LINK_NEAR=$(tr -d '\r\n' < gdrive-links-near/download_link.txt | sed 's/[\x00-\x1F]//g')
          WINDOWS_PREVIEW_LINK_NEAR=$(tr -d '\r\n' < gdrive-links-near/view_link.txt | sed 's/[\x00-\x1F]//g')

          # Read Rh links
          WINDOWS_DOWNLOAD_LINK_RH=$(tr -d '\r\n' < gdrive-links-rh/download_link.txt | sed 's/[\x00-\x1F]//g')
          WINDOWS_PREVIEW_LINK_RH=$(tr -d '\r\n' < gdrive-links-rh/view_link.txt | sed 's/[\x00-\x1F]//g')

          echo "Windows download link (Base): ${WINDOWS_DOWNLOAD_LINK_BASE}, length: ${#WINDOWS_DOWNLOAD_LINK_BASE}"
          echo "Windows preview link (Base): ${WINDOWS_PREVIEW_LINK_BASE}, length: ${#WINDOWS_PREVIEW_LINK_BASE}"
          echo "Windows download link (Near): ${WINDOWS_DOWNLOAD_LINK_NEAR}, length: ${#WINDOWS_DOWNLOAD_LINK_NEAR}"
          echo "Windows preview link (Near): ${WINDOWS_PREVIEW_LINK_NEAR}, length: ${#WINDOWS_PREVIEW_LINK_NEAR}"
          echo "Windows download link (Rh): ${WINDOWS_DOWNLOAD_LINK_RH}, length: ${#WINDOWS_DOWNLOAD_LINK_RH}"
          echo "Windows preview link (Rh): ${WINDOWS_PREVIEW_LINK_RH}, length: ${#WINDOWS_PREVIEW_LINK_RH}"

          # Set outputs
          echo "WINDOWS_DOWNLOAD_LINK_BASE=${WINDOWS_DOWNLOAD_LINK_BASE}" >> $GITHUB_ENV
          echo "WINDOWS_PREVIEW_LINK_BASE=${WINDOWS_PREVIEW_LINK_BASE}" >> $GITHUB_ENV
          echo "WINDOWS_DOWNLOAD_LINK_NEAR=${WINDOWS_DOWNLOAD_LINK_NEAR}" >> $GITHUB_ENV
          echo "WINDOWS_PREVIEW_LINK_NEAR=${WINDOWS_PREVIEW_LINK_NEAR}" >> $GITHUB_ENV
          echo "WINDOWS_DOWNLOAD_LINK_RH=${WINDOWS_DOWNLOAD_LINK_RH}" >> $GITHUB_ENV
          echo "WINDOWS_PREVIEW_LINK_RH=${WINDOWS_PREVIEW_LINK_RH}" >> $GITHUB_ENV

      - name: Print the Google Drive links
        run: |
          echo "Windows download link (Base): ${{ env.WINDOWS_DOWNLOAD_LINK_BASE }}"
          echo "Windows preview link (Base): ${{ env.WINDOWS_PREVIEW_LINK_BASE }}"
          echo "Windows download link (Near): ${{ env.WINDOWS_DOWNLOAD_LINK_NEAR }}"
          echo "Windows preview link (Near): ${{ env.WINDOWS_PREVIEW_LINK_NEAR }}"
          echo "Windows download link (Rh): ${{ env.WINDOWS_DOWNLOAD_LINK_RH }}"
          echo "Windows preview link (Rh): ${{ env.WINDOWS_PREVIEW_LINK_RH }}"

      - name: Download Mac DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: mac-app-${{ env.RELEASE_VERSION }}-*

      - name: Move Mac DMGs
        run: |
          ls -lR mac-app*
          mv mac-app*/* ./

      - name: Print the workspace
        run: |
          ls -l

      - name: Generate the changelog
        run: |
          # Escape the links for sed
          windows_base_link_escaped=$(printf '%s\n' "${{ env.WINDOWS_DOWNLOAD_LINK_BASE }}" | sed -e 's/[\/&]/\\&/g')
          windows_near_link_escaped=$(printf '%s\n' "${{ env.WINDOWS_DOWNLOAD_LINK_NEAR }}" | sed -e 's/[\/&]/\\&/g')
          windows_rh_link_escaped=$(printf '%s\n' "${{ env.WINDOWS_DOWNLOAD_LINK_RH }}" | sed -e 's/[\/&]/\\&/g')
          # Replace placeholders in the changelog template
          sed -i "s/RELEASE_VERSION/${{ env.RELEASE_VERSION }}/g" build/changelog-template.md
          sed -i "s/WINDOWS_LINK_BASE/$windows_base_link_escaped/g" build/changelog-template.md
          sed -i "s/WINDOWS_LINK_NEAR/$windows_near_link_escaped/g" build/changelog-template.md
          sed -i "s/WINDOWS_LINK_RH/$windows_rh_link_escaped/g" build/changelog-template.md

      - id: release
        name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: build/changelog-template.md
          files: |
            crynux-node-lithium-v${{ env.RELEASE_VERSION }}-base-mac-arm64-unsigned.dmg
            crynux-node-lithium-v${{ env.RELEASE_VERSION }}-near-mac-arm64-unsigned.dmg
            crynux-node-lithium-v${{ env.RELEASE_VERSION }}-rh-mac-arm64-unsigned.dmg

      - name: Resolve Mac download links by filename
        id: mac_links
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_ASSETS: ${{ steps.release.outputs.assets }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          python3 <<'PY'
          import json
          import os

          assets = json.loads(os.environ["RELEASE_ASSETS"])
          version = os.environ["RELEASE_VERSION"]
          wanted = {
              "base": f"crynux-node-lithium-v{version}-base-mac-arm64-unsigned.dmg",
              "near": f"crynux-node-lithium-v{version}-near-mac-arm64-unsigned.dmg",
              "rh": f"crynux-node-lithium-v{version}-rh-mac-arm64-unsigned.dmg",
          }
          by_name = {asset["name"]: asset["browser_download_url"] for asset in assets}
          missing = [name for name in wanted.values() if name not in by_name]
          if missing:
              raise SystemExit(f"missing release assets: {missing}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"MAC_LINK_BASE={by_name[wanted['base']]}\n")
              env_file.write(f"MAC_LINK_NEAR={by_name[wanted['near']]}\n")
              env_file.write(f"MAC_LINK_RH={by_name[wanted['rh']]}\n")
          PY
    outputs:
      windows-download-link-base: ${{ env.WINDOWS_DOWNLOAD_LINK_BASE }}
      windows-preview-link-base: ${{ env.WINDOWS_PREVIEW_LINK_BASE }}
      windows-download-link-near: ${{ env.WINDOWS_DOWNLOAD_LINK_NEAR }}
      windows-preview-link-near: ${{ env.WINDOWS_PREVIEW_LINK_NEAR }}
      windows-download-link-rh: ${{ env.WINDOWS_DOWNLOAD_LINK_RH }}
      windows-preview-link-rh: ${{ env.WINDOWS_PREVIEW_LINK_RH }}
      mac-link-base: ${{ env.MAC_LINK_BASE }}
      mac-link-near: ${{ env.MAC_LINK_NEAR }}
      mac-link-rh: ${{ env.MAC_LINK_RH }}

  update-documentation:
    runs-on: ubuntu-22.04
    needs:
      - publish-release
    steps:
      - name: Dispatch event to the documentation repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT }}
          repository: ${{ github.repository_owner }}/documentation
          event-type: node-released
          client-payload: |-
            {
              "windows-download-link-base": "${{ needs.publish-release.outputs.windows-download-link-base }}",
              "windows-preview-link-base": "${{ needs.publish-release.outputs.windows-preview-link-base }}",
              "windows-download-link-near": "${{ needs.publish-release.outputs.windows-download-link-near }}",
              "windows-preview-link-near": "${{ needs.publish-release.outputs.windows-preview-link-near }}",
              "windows-download-link-rh": "${{ needs.publish-release.outputs.windows-download-link-rh }}",
              "windows-preview-link-rh": "${{ needs.publish-release.outputs.windows-preview-link-rh }}",
              "mac-link-base": "${{ needs.publish-release.outputs.mac-link-base }}",
              "mac-link-near": "${{ needs.publish-release.outputs.mac-link-near }}",
              "mac-link-rh": "${{ needs.publish-release.outputs.mac-link-rh }}",
              "release-version": "${{ env.RELEASE_VERSION }}"
            }
  update-docker-compose-project:
    runs-on: ubuntu-22.04
    needs:
      - publish-release
    steps:
      - name: Dispatch event to the docker-compose repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT }}
          repository: ${{ github.repository_owner }}/crynux-node-docker-compose
          event-type: node-released
          client-payload: |-
            {
              "release-version": "${{ env.RELEASE_VERSION }}"
            }
